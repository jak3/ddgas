<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logo placeholder: cesta di prodotti">
  <defs>
    <clipPath id="basket-body">
      <path d="M30 56 L90 56 L82 92 Q60 98 38 92 Z"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="58" fill="#f7f3ee" stroke="#e2dccf" stroke-width="2"/>

  <!-- prodotti che sbucano dalla cesta -->
  <circle cx="45" cy="48" r="9" fill="#8fb96b"/>
  <circle cx="60" cy="41" r="10" fill="#e08e45"/>
  <circle cx="75" cy="48" r="9" fill="#c65b4e"/>
  <path d="M58 33 q2 -9 9 -9" fill="none" stroke="#5b8c5a" stroke-width="3" stroke-linecap="round"/>

  <!-- manici -->
  <path d="M38 58 Q30 44 44 40" fill="none" stroke="#a56a3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 58 Q90 44 76 40" fill="none" stroke="#a56a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- corpo della cesta, con trama intrecciata -->
  <path d="M30 56 L90 56 L82 92 Q60 98 38 92 Z" fill="#c98a4f"/>
  <g clip-path="url(#basket-body)" stroke="#a56a3a" stroke-width="2" opacity="0.6">
    <line x1="20" y1="68" x2="100" y2="68"/>
    <line x1="20" y1="80" x2="100" y2="80"/>
    <line x1="45" y1="50" x2="42" y2="100"/>
    <line x1="60" y1="50" x2="60" y2="100"/>
    <line x1="75" y1="50" x2="78" y2="100"/>
  </g>

  <rect x="28" y="52" width="64" height="8" rx="4" fill="#a56a3a"/>
</svg>
